<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="white" stroke-opacity="0.2" stroke-width="8" fill="none" />

  <!-- Stylized "Q" letterform -->
  <g filter="url(#shadow)">
    <!-- Outer circle of Q -->
    <path
      d="M256 100 C170 100 104 166 104 252 C104 338 170 404 256 404 C292 404 324 391 350 370 L394 414 C402 422 414 422 422 414 C430 406 430 394 422 386 L378 342 C397 317 408 286 408 252 C408 166 342 100 256 100 Z M256 348 C202 348 160 306 160 252 C160 198 202 156 256 156 C310 156 352 198 352 252 C352 306 310 348 256 348 Z"
      fill="url(#glow-grad)"
    />
    
    <!-- Diagonal tail highlight of Q -->
    <path
      d="M328 328 L390 390"
      stroke="white"
      stroke-width="36"
      stroke-linecap="round"
    />
  </g>

  <!-- Top-right energetic spark -->
  <path
    d="M390 120 L398 142 L420 150 L398 158 L390 180 L382 158 L360 150 L382 142 Z"
    fill="#fde047"
  />
</svg>
